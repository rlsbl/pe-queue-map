<script>
  // ================= Supabase 配置（优先走自定义反代域名，不可达时自动回退官方直连） =================
  const SUPABASE_ENDPOINTS = [
    'https://pe-api.rlsbl.cc.cd',
    'https://ihvervlbgwtrxwvneqqc.supabase.co'
  ];
  const SUPABASE_KEY = 'sb_publishable_AtmflmhQfranf1FBvkO60Q_qMWMDei7';
  let activeEndpointIndex = 0;

  async function fetchWithTimeout(url, options = {}, timeoutMs = 8000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
    } finally {
      clearTimeout(timer);
    }
  }

  async function sbRestFetch(queryString = '', options = {}) {
    const headers = Object.assign(
      {
        apikey: SUPABASE_KEY,
        Accept: 'application/json'
      },
      options.headers || {}
    );

    // 优先使用当前可用节点；遇到 DNS/SSL 未生效、CORS 拦截或超时则自动尝试备用节点
    const tryOrder = [
      activeEndpointIndex,
      ...SUPABASE_ENDPOINTS.map((_, idx) => idx).filter((idx) => idx !== activeEndpointIndex)
    ];

    let lastNetworkErr = null;
    for (const idx of tryOrder) {
      const endpoint = `${SUPABASE_ENDPOINTS[idx]}/rest/v1/queue_pins${queryString}`;
      let res;
      try {
        res = await fetchWithTimeout(endpoint, Object.assign({}, options, { headers }), 8000);
      } catch (err) {
        lastNetworkErr = err;
        continue;
      }

      activeEndpointIndex = idx;

      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try {
          const errBody = await res.json();
          if (errBody && (errBody.message || errBody.error)) {
            msg = errBody.message || errBody.error;
          }
        } catch (_) {}
        throw new Error(msg);
      }
      if (res.status === 204) return null;
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }

    throw lastNetworkErr || new Error('网络连接失败，请稍后重试');
  }
